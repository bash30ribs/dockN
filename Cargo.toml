[package]
name = "dockN"
version = "0.2.0"
edition = "2024"
authors = ["dockN Engineering <bishthrishav@gmail.com>"]
description = "🧠 Pillar 1: The Subconscious — Personal Analytics with eBPF, Focus Tracking & Kernel Telemetry"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bash30ribs/dockN"
keywords = ["ebpf", "telemetry", "analytics", "deep-work", "subconscious"]
categories = ["command-line-utilities", "development-tools::profiling"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
dirs = "7.0.0"
libc = "0.2.191"
notify = "8.2.2"
rusqlite = { version = "0.42.0", features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.3"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
